# Docker Compose for the WooCommerce Chatwoot AI bot (for Docker panels such as Hostinger Docker Manager).
# It pulls the ready-made image that GitHub Actions builds on every push.
# Put your values in the panel's "Environment" section. Anything left empty uses the built-in default.
services:
  bot:
    image: ghcr.io/shopjiaexpress-dev/woo-chatwoot-bot:latest
    container_name: woo-chatwoot-bot
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - bot-data:/data          # website index, guides, screenshots, key pages - keep this!
    environment:
      # --- Store ---
      STORE_NAME: ${STORE_NAME:-}
      SITE_URL: ${SITE_URL:-}
      SITEMAP_URL: ${SITEMAP_URL:-}
      EXTRA_INSTRUCTIONS: ${EXTRA_INSTRUCTIONS:-}
      # --- WooCommerce ---
      WOO_URL: ${WOO_URL:-}
      WOO_CONSUMER_KEY: ${WOO_CONSUMER_KEY:-}
      WOO_CONSUMER_SECRET: ${WOO_CONSUMER_SECRET:-}
      # --- Chatwoot ---
      CHATWOOT_URL: ${CHATWOOT_URL:-}
      CHATWOOT_BOT_TOKEN: ${CHATWOOT_BOT_TOKEN:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # --- AI (free) ---
      LLM_PROVIDERS: ${LLM_PROVIDERS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      # --- Bot behaviour (optional) ---
      MAX_PRODUCT_CARDS: ${MAX_PRODUCT_CARDS:-}
      SHOW_PRODUCT_IMAGES: ${SHOW_PRODUCT_IMAGES:-}
      AUTO_HANDOFF: ${AUTO_HANDOFF:-}
      HANDOFF_MESSAGE: ${HANDOFF_MESSAGE:-}
      CURRENCY_SYMBOL: ${CURRENCY_SYMBOL:-}
      PRODUCT_LINK_TEMPLATE: ${PRODUCT_LINK_TEMPLATE:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-}
    mem_limit: 512m

volumes:
  bot-data:
