# Compose file for Docker panels that deploy from a single compose URL
# (e.g. Hostinger Docker Manager). It pulls the ready-made image that the
# GitHub Action (.github/workflows/docker.yml) builds on every push.
# The GitHub package must be PUBLIC so the server can pull it.
# Set the variables below in your panel's "Environment variables" section.
services:
  bot:
    image: ghcr.io/shopjiaexpress-dev/woo-chatwoot-bot:latest
    container_name: woo-chatwoot-bot
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - bot-data:/data
    environment:
      STORE_NAME: ${STORE_NAME:-My Shop}
      SITE_URL: ${SITE_URL}
      SITEMAP_URL: ${SITEMAP_URL:-}
      EXTRA_INSTRUCTIONS: ${EXTRA_INSTRUCTIONS:-}
      WOO_URL: ${WOO_URL:-}
      WOO_CONSUMER_KEY: ${WOO_CONSUMER_KEY}
      WOO_CONSUMER_SECRET: ${WOO_CONSUMER_SECRET}
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_BOT_TOKEN: ${CHATWOOT_BOT_TOKEN:-}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-gemini,groq,openrouter}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-24}
    mem_limit: 512m

volumes:
  bot-data:
